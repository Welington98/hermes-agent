services:
  hermes:
    build:
      context: .
      args:
        # Pin a release tag in production, e.g. nousresearch/hermes-agent:v0.22.5
        HERMES_BASE: ${HERMES_BASE:-nousresearch/hermes-agent:latest}
    image: hermes-agent-desktop:local
    container_name: hermes
    restart: unless-stopped
    command: gateway run
    shm_size: "1g" # required for Playwright/Chromium browser automation
    ports:
      - "8642:8642" # OpenAI-compatible API server + health endpoint
      - "9119:9119" # web dashboard (includes the Bot Desktop / Screen pane)
    volumes:
      - ./hermes-data:/opt/data
    environment:
      HERMES_DASHBOARD: "1"
      HERMES_DASHBOARD_HOST: "0.0.0.0"
      HERMES_DASHBOARD_PORT: "9119"
      # Required because the dashboard binds to 0.0.0.0: it refuses to start
      # on a non-loopback bind without an auth provider configured.
      HERMES_DASHBOARD_BASIC_AUTH_USERNAME: "${HERMES_DASHBOARD_BASIC_AUTH_USERNAME}"
      HERMES_DASHBOARD_BASIC_AUTH_PASSWORD: "${HERMES_DASHBOARD_BASIC_AUTH_PASSWORD}"
      HERMES_DASHBOARD_BASIC_AUTH_SECRET: "${HERMES_DASHBOARD_BASIC_AUTH_SECRET}"
      API_SERVER_ENABLED: "true"
      API_SERVER_HOST: "0.0.0.0"
      API_SERVER_KEY: "${API_SERVER_KEY}"
      PUID: "${PUID:-1000}"
      PGID: "${PGID:-1000}"
    deploy:
      resources:
        limits:
          # The Xfce desktop adds ~220 MiB when running (Xvnc + xfwm4 + panel).
          memory: 4G
          cpus: "2.0"
